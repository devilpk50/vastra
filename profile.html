<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Vastra Revival</title>
    <link rel="shortcut icon" type="image/jpg" href="assets/logo.png" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/profile.css" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Profile Container -->
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h2 class="card-title fw-bold mb-4">My Profile</h2>
                        
                        <!-- Profile Form -->
                        <form id="profileForm">
                            <div class="mb-3">
                                <label for="profileName" class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control" id="profileName" placeholder="Full Name" disabled>
                            </div>

                            <div class="mb-3">
                                <label for="profileEmail" class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" id="profileEmail" placeholder="Email" disabled>
                            </div>

                            <div class="mb-3">
                                <label for="profilePhone" class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" class="form-control" id="profilePhone" placeholder="Phone Number" disabled>
                            </div>

                            <div class="mb-3">
                                <label for="profileAddress" class="form-label fw-semibold">Address</label>
                                <input type="text" class="form-control" id="profileAddress" placeholder="Address">
                            </div>

                            <div class="mb-3">
                                <label for="profileCity" class="form-label fw-semibold">City</label>
                                <input type="text" class="form-control" id="profileCity" placeholder="City">
                            </div>

                            <div class="mb-3">
                                <label for="profileZip" class="form-label fw-semibold">Zip Code</label>
                                <input type="text" class="form-control" id="profileZip" placeholder="Zip Code">
                            </div>

                            <div id="successMsg" class="alert alert-success" style="display: none;"></div>
                            <div id="errorMsg" class="alert alert-danger" style="display: none;"></div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-dark fw-bold">Update Profile</button>
                                <a href="/index.html" class="btn btn-outline-dark fw-bold">Back</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/scripts.js"></script>
    <script src="js/profile.js"></script>

</body>
</html>
